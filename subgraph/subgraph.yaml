specVersion: 1.0.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: PredictionMarket
    network: arbitrum-sepolia
    source:
      # Replace with deployed address after L2 deployment
      address: "0x0000000000000000000000000000000000000000"
      abi: PredictionMarket
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Market
        - ProtocolStats
      abis:
        - name: PredictionMarket
          file: ./abis/PredictionMarket.json
      eventHandlers:
        - event: MarketCreated(indexed uint256,string,address,int256)
          handler: handleMarketCreated
        - event: MarketActivated(indexed uint256)
          handler: handleMarketActivated
        - event: MarketDisputeStarted(indexed uint256,uint8,uint256)
          handler: handleMarketDisputeStarted
        - event: MarketResolved(indexed uint256,uint8)
          handler: handleMarketResolved
        - event: WinningsClaimed(indexed uint256,indexed address,uint256)
          handler: handleWinningsClaimed
      file: ./src/mapping.ts

  - kind: ethereum
    name: MarketAMM
    network: arbitrum-sepolia
    source:
      address: "0x0000000000000000000000000000000000000000"
      abi: MarketAMM
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Trade
        - LiquidityPosition
        - ProtocolStats
      abis:
        - name: MarketAMM
          file: ./abis/MarketAMM.json
      eventHandlers:
        - event: SharesBought(indexed uint256,indexed address,uint8,uint256,uint256)
          handler: handleSharesBought
        - event: SharesSold(indexed uint256,indexed address,uint8,uint256,uint256)
          handler: handleSharesSold
        - event: LiquidityAdded(indexed uint256,indexed address,uint256)
          handler: handleLiquidityAdded
        - event: LiquidityRemoved(indexed uint256,indexed address,uint256)
          handler: handleLiquidityRemoved
        - event: FeeCollected(indexed uint256,uint256)
          handler: handleFeeCollected
      file: ./src/mapping.ts

  - kind: ethereum
    name: PMGovernor
    network: arbitrum-sepolia
    source:
      address: "0x0000000000000000000000000000000000000000"
      abi: PMGovernor
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - GovernanceProposal
        - ProposalVote
      abis:
        - name: PMGovernor
          file: ./abis/PMGovernor.json
      eventHandlers:
        - event: ProposalCreated(uint256,address,address[],uint256[],string[],bytes[],uint256,uint256,string)
          handler: handleProposalCreated
        - event: VoteCast(indexed address,uint256,uint8,uint256,string)
          handler: handleVoteCast
        - event: ProposalQueued(uint256,uint256)
          handler: handleProposalQueued
        - event: ProposalExecuted(uint256)
          handler: handleProposalExecuted
        - event: ProposalCanceled(uint256)
          handler: handleProposalCanceled
      file: ./src/mapping.ts
