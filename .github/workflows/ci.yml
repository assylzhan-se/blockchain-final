name: CI
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-and-test:
    name: Compile · Test · Coverage · Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Compile contracts
        run: forge build --sizes

      - name: Run tests
        run: forge test -v

      - name: Coverage
        run: forge coverage --no-match-test "invariant_" --report summary

      - name: Forge fmt check
        run: forge fmt --check